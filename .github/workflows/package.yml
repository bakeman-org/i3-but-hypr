name: Package (deb)

on:
  workflow_dispatch:
  push:
    branches: [master, next, main, i3-but-hypr]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  NFPM_VERSION: "2.38.0"
  PKG_NAME: i3-but-hypr

jobs:
  build-deb:
    name: build deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential pkg-config git ca-certificates curl \
            jq gettext asciidoc xmlto docbook-xml libpod-simple-perl \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-util0-dev \
            libxcb-cursor-dev libxcb-keysyms1-dev libxcb-icccm4-dev \
            libxcb-xinerama0-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xrm-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libstartup-notification0-dev \
            libpango1.0-dev libcairo2-dev libyajl-dev libev-dev \
            liblua5.4-dev libpcre2-dev

      - name: Build
        run: |
          meson setup build --prefix=/usr --buildtype=release -Dmans=true
          ninja -C build
          meson test -C build i3ext_scan
          DESTDIR="$PWD/pkg" ninja -C build install

      - name: Install nfpm
        run: |
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tgz
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
          nfpm --version

      - name: Package deb
        env:
          ARCH: amd64
        run: |
          VERSION=$(meson introspect build --projectinfo | jq -r .version)
          case "$VERSION" in
            *.*.*) ;;
            *) VERSION="${VERSION}.0" ;;
          esac
          export VERSION RELEASE="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          envsubst '${VERSION} ${RELEASE} ${ARCH}' \
            < .github/packaging/nfpm.yaml > /tmp/nfpm.yaml
          nfpm package --config /tmp/nfpm.yaml --packager deb --target dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: publish release assets
    needs: [build-deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # Tag pushes publish a normal release; branch builds update a
          # branch-specific "-latest" release so the .deb is always available.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-latest', github.ref_name) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Latest {0} build', github.ref_name) }}
          prerelease: false
          files: |
            dist/*.deb
          generate_release_notes: false
